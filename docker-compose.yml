services:
  timescaledb:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: netwalk-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netwalk-network

  api:
    build:
      context: ./backend
      target: runner
    container_name: netwalk-api
    ports:
      - "8000:8000" # api exposed to host at 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - netwalk-network

  frontend:
    build:
      context: ./frontend
    container_name: netwalk-frontend
    ports:
      - "8080:80" # nginx exposed to host at 8000
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - netwalk-network

  iperf3:
    image: networkstatic/iperf3
    container_name: netwalk-iperf
    ports:
      - "5201:5201/tcp"
      - "5201:5201/udp"
    command: ["-s"]
    restart: always
    networks:
      - netwalk-network
  iperf3-2:
    image: networkstatic/iperf3
    container_name: netwalk-iperf-2
    ports:
      - "5202:5201/tcp"
      - "5202:5201/udp"
    command: ["-s"]
    restart: always
    networks:
      - netwalk-network
  iperf3-3:
    image: networkstatic/iperf3
    container_name: netwalk-iperf-3
    ports:
      - "5203:5201/tcp"
      - "5203:5201/udp"
    command: ["-s"]
    restart: always
    networks:
      - netwalk-network

  tests:
    build:
      context: ./backend
      target: test
    container_name: netwalk-tests
    env_file:
      - .env
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/netwalk_test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/netwalk_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netwalk_test
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles:
      - test
    networks:
      - netwalk-network

networks:
  netwalk-network:
    driver: bridge

volumes:
  db_data:
