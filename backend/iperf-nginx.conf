worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    lua_shared_dict iperf_locks 10m;

    lua_shared_dict iperf_ips 1m;

    init_worker_by_lua_block {
        local delay = 2
        local resolver = require "resty.dns.resolver"

        local function check_container_ips()
            local r, err = resolver:new{
                nameservers = {"127.0.0.11"}
                timeout = 1000,
            }
            if not r then
                ngx.log(ngx.ERR, "Failed to create DNS resolver: ", err)
                return
            end

            local backends = {"netwalk-iperf", "netwalk-iperf-2", "netwalk-iperf-3"}
            local ip_cache = ngx.shared.iperf_ips

            for _, host in ipairs(backends) do
                local answers, dns_err = r:query(host, { qtype = r.TYPE_A })
                if answers and not answers.errcode then
                    for _, ans in ipairs(answers) do
                        if ans.address then
                            ip_cache:set(host, ans.address)
                            break
                        end
                    end
                else
                    ngx.log(ngx.ERR, "Docker DNS failed to resolve ", host, ": ", dns_err or "unknown error")
                end
            end

            local ok, timer_err = ngx.timer.at(delay, check_container_ips)
            if not ok then
                ngx.log(ngx.ERR, "Failed to schedule background DNS timer: ", timer_err)
            end
        end

        local ok, first_err = ngx.timer.at(0, check_container_ips)
        if not ok then
            ngx.log(ngx.ERR, "Failed to start initial DNS loop: ", first_err)
        end
    }

    upstream backend_pool {
        server 0.0.0.1:12345;

        balancer_by_lua_block {
            local balancer = require "ngx.balancer"
            local locks = ngx.shared.iperf_locks
            local ip_cache = ngx.shared.iperf_ips
            local client_ip = ngx.var.remote_addr

            local backends = {
                "netwalk-iperf",
                "netwalk-iperf-2",
                "netwalk-iperf-3"
            }

            local assigned_idx = locks:get(client_ip)

            if not assigned_idx then
                local backend_usage = {false, false, false}
                local keys = locks:get_keys(0)

                for _, ip in ipairs(keys) do
                    local idx = locks:get(ip)
                    if idx and ip ~= client_ip then
                        backend_usage[idx] = true
                    end
                end

                for i, is_busy in ipairs(backend_usage) do
                    if not is_busy then
                        assigned_idx = i
                        break
                    end
                end

                if not assigned_idx then
                    assigned_idx = math.random(#backends)
                end

                locks:set(client_ip, assigned_idx, 30)
            end

            local target_host = backends[assigned_idx]

            local target_ip = ip_cache:get(target_host)

            if not target_ip then
                ngx.log(ngx.ERR, "Target backend container IP not cached yet for: ", target_host)
                return ngx.exit(500)
            end

            local ok, set_err = balancer.set_current_peer(target_ip, 5201)
            if not ok then
                ngx.log(ngx.ERR, "Failed to set peer socket: ", set_err)
                return ngx.exit(500)
            end
        }
    }

    server {
        listen 5201;
        listen 5201 udp;

        proxy_pass backend_pool;

        proxy_connect_timeout 2s;
        proxy_timeout 30s;
    }
}
